# v2 = v1 plus one more epoch (Task 2 step 5, used for the Task 4 rolling update). `make train-v2`.
seed: 42
learning_rate: 0.0003
batch_size: 8
epochs: 5
max_length: 96            # tokens per example (prompt + teacher JSON + EOS)
model_name: EleutherAI/pythia-70m
train_file: data/v1/train.jsonl
max_records: 1500         # handout limit: first 1,500 records of the cleaned dataset
output_dir: training/out/v2
loss_csv: training/loss_v2.csv
library_versions:
  python: "3.11"
  torch: "2.15.0"
  transformers: "5.22.2"
